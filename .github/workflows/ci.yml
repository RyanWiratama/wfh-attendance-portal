name: CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend-ci:
    name: Backend Lint, Test & Build
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: wfh_root_pass
          MYSQL_USER: wfh_user
          MYSQL_PASSWORD: wfh_secret_pass
          MYSQL_DATABASE: wfh_employee
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping -h localhost -u root -pwfh_root_pass" --health-interval=5s --health-timeout=5s --health-retries=10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        run: |
          cd backend
          npm ci

      - name: Run Backend Unit Tests
        run: |
          cd backend
          npm test
        env:
          JWT_SECRET: ci-test-secret-key-min-32-characters-wfh

      - name: Run Backend E2E Tests
        run: |
          cd backend
          npm run test:e2e
        env:
          JWT_SECRET: ci-test-secret-key-min-32-characters-wfh

      - name: Build Backend Microservices
        run: |
          cd backend
          npm run build api-gateway
          npm run build auth-service
          npm run build employee-service
          npm run build attendance-service

  frontend-ci:
    name: Frontend Lint, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Run Frontend Component Tests (Vitest)
        run: |
          cd frontend
          npm test

      - name: Build Frontend Production Bundle
        run: |
          cd frontend
          npm run build

  docker-ci:
    name: Docker Images Build Verification
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: wfh-backend:test

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          tags: wfh-frontend:test
